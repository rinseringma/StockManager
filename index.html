<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voorraadbeheer</title>
  <script src="app.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center space-y-4">
  <div class="w-full max-w-md p-4 bg-white rounded shadow-md">
    <h1 class="text-2xl font-bold text-center mb-4">Voorraadbeheer</h1>
      <input 
        id="barcodeInput" 
        type="text" 
        placeholder="Scan of voer barcode in" 
        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
        autofocus
      />
    
    <div id="popup" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
      <div class="bg-white rounded p-4 w-96">
        <div id="popupContent"></div>
        <button 
          id="closePopup" 
          class="mt-4 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 w-full">
          Sluiten
        </button>
      </div>
    </div>
  </div>
  <button 
    onclick="window.location.href='voorraadbeheer_pagina.html'" 
    class="w-full max-w-md px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
    Bekijk voorraad
  </button>
</body> 
</html>
